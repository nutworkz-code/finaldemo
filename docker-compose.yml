services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsinsight
      POSTGRES_PASSWORD: opsinsight
      POSTGRES_DB: opsinsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsinsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://opsinsight:opsinsight@postgres:5432/opsinsight
      SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
