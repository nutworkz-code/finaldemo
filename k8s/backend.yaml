apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opsinsight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: opsinsight-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://opsinsight:opsinsight@postgres:5432/opsinsight
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: opsinsight
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opsinsight
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
